[package]
name = "chk"
version = "1.1.0"
authors = ["Ella Mae <ellaammae@email.com>"]
edition = "2024"
description = "The guided, locked-down layer of Pelican UI for consistent, reliable RAMP interfaces."
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/chk"
readme = "README.md"
documentation = "https://docs.rs/chk"

[lib]
name = "chk"
path = "src/lib.rs"

[dependencies]
serde = "1.0.219"
pelican_ui = {version = "2.2.0", path = "../pelican_ui"}
prism = {package = "prism2", version = "2.0.0"}
ptsd = {package = "ptsd2", version = "0.1.3", path = "../ptsd"}
dyn-clone = "1.0.20"
rand = "0.8"
uuid = {version = "1.16.0", features = ["v4", "js"]}

futures = "0.3.34"
