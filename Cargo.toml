[package]
name = "chk"
version = "1.1.0"
authors = ["Ella Mae <ellaammae@email.com>"]
edition = "2024"
description = "The guided, locked-down layer of Pelican UI for consistent, reliable RAMP interfaces."
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/chk"
readme = "README.md"
documentation = "https://docs.rs/chk"

[lib]
name = "chk"
path = "src/lib.rs"

[dependencies]
serde = "1.0.219"
pelican_ui = {path="../pelican_ui"}
prism = {package = "prism2", version = "1.0.0"}
ptsd = {package="ptsd2", path="../ptsd"}
dyn-clone = "1.0.20"
rand = "0.8"
